# dev: PostgreSQL (쿠버네티스 dev namespace 의 CloudNativePG)
# 접속 정보는 ConfigMap(backend-config) / Secret(pg-app) 에서 환경변수로 주입된다.
spring.datasource.url=jdbc:postgresql://${DB_HOST:pg-rw}:${DB_PORT:5432}/${DB_NAME:app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.h2.console.enabled=false
