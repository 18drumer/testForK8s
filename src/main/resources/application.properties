spring.application.name=testForK8s

# 프로필 미지정 시 local. 컨테이너에서는 SPRING_PROFILES_ACTIVE=dev|prod 로 덮어쓴다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# startupProbe warm-up 구간. 이 시간 동안 /startupProbe 는 500 을 응답한다.
app.startup-probe.warm-up-duration=60s

# TB_USER 테이블이 없으면 기동 시 생성한다(있으면 유지).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
